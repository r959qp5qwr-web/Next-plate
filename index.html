<style>
/* Layout: the answer sits on light paper at the top; a dark instrument console is docked under the thumb. The meal dial is a day arc: the sun slides from breakfast to dinner. */
:root{
  --paper:#f1f2f6; --card:#ffffff; --ink:#151a30; --sub:#4a5170; --line:#d8dbe7; --soft:#e9ebf3;
  --panel:#151a30; --seg:#262d4f; --pline:#3a426b; --ptext:#f1f2fa; --psub:#b6bcda;
  --sun:#ffb400; --sun-ink:#221800; --note:#fff4d6; --note-ink:#3d2c00;
  --v:#3d9a4a; --d:#d39a14; --g:#c4915a; --m:#fbf6e6; --p:#dc5a3a; --f:#e0457b; --n:#8b5e34;
  --display:"Red Hat Display","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --ch:0px; --ps:1;
  color-scheme:light;
}
*{box-sizing:border-box}
html{font-size:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:1rem;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:.5rem 1.25rem}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid #2f6bff;outline-offset:2px}
.console button:focus-visible,.console [tabindex]:focus-visible{outline-color:var(--sun)}
.app{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:.625rem}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:.75rem;min-height:2.75rem}
.mark{display:flex;align-items:center;gap:.4rem;font:900 1.0625rem/1 var(--display);letter-spacing:-.02em}
.mark svg{width:1.375rem;height:1.375rem}
.my{min-height:2.75rem;max-width:62%;border:1.5px solid var(--line);background:var(--card);border-radius:1.375rem;padding:.25rem .5rem .25rem .875rem;display:flex;align-items:center;gap:.375rem;text-align:left;min-width:0}
.my span{display:block;min-width:0;font-size:.875rem;line-height:1.2}
.my b{display:block;font-size:.75rem;font-weight:700;color:var(--sub)}
.my svg{width:1.125rem;height:1.125rem;flex:none}

/* head */
.head h1{margin:0;font:900 1.4375rem/1.1 var(--display);letter-spacing:-.025em;text-wrap:balance}
.head p{margin:.125rem 0 0;font-size:.875rem;color:var(--sub)}

/* plate tabs */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.25rem;margin-bottom:-.625rem}
.tab{border:0;background:transparent;border-radius:1.125rem 1.125rem 0 0;padding:.5rem .25rem .75rem;display:flex;flex-direction:column;align-items:center;gap:.125rem;color:var(--sub);font:700 .875rem/1.18 var(--body);text-align:center;min-width:0}
.tab .pl{width:min(4.75rem,100%);aspect-ratio:1;flex:none;display:grid;place-items:center}
.tab .pl svg{width:100%;height:100%;transform:scale(calc(.8*var(--ps)));transform-origin:50% 55%;transition:transform .3s cubic-bezier(.3,1.4,.4,1)}
.tab[aria-selected="true"]{background:var(--card);color:var(--ink)}
.tab[aria-selected="true"] .pl svg{transform:scale(calc(.98*var(--ps)))}
.tab span{overflow-wrap:break-word;hyphens:auto;max-width:100%}
@media (max-height:43rem){.head p{display:none}.tab .pl{width:min(4rem,100%)}.tab{padding-top:.25rem}}

/* detail panel */
.panel{background:var(--card);border-radius:1.125rem;padding:.875rem 1rem 1rem;display:flex;flex-direction:column;gap:.75rem;touch-action:pan-y}
.panel[data-sel="0"]{border-top-left-radius:0}.panel[data-sel="2"]{border-top-right-radius:0}
.ptop{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
.ptop h2{margin:0;font:800 1.375rem/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance;min-width:0}
.copy{flex:none;min-height:2.75rem;border:0;border-radius:1.375rem;background:var(--sun);color:var(--sun-ink);padding:.375rem .875rem;display:inline-flex;align-items:center;gap:.375rem;font-weight:700;font-size:.9375rem}
.copy svg,.act svg{width:1.125rem;height:1.125rem;flex:none}
.copy:active,.act:active,.tab:active .pl,.key:active,.segs button:active,.meals button:active,.pill:active{transform:scale(.96)}
.items{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:.4375rem}
.items li{display:flex;gap:.625rem;align-items:flex-start;font-size:1.0625rem;line-height:1.3}
.items b{font-weight:700}
.sw{width:.9375rem;height:.9375rem;flex:none;margin-top:.22rem;border-radius:.25rem;overflow:hidden;display:block}
.tag{font-style:normal;font-size:.75rem;font-weight:700;background:var(--soft);border-radius:.5rem;padding:.0625rem .375rem;margin-left:.25rem;white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:.375rem}
.chip{font-size:.8125rem;font-weight:700;background:var(--soft);border-radius:.75rem;padding:.1875rem .5625rem}
.chip.hit{background:#dff3e2;color:#14532a}
.why{margin:0;font-size:1rem}
.why b{display:block;font-size:.8125rem;color:var(--sub);font-weight:700}
.notes{background:var(--note);color:var(--note-ink);border-radius:.875rem;padding:.625rem .75rem;display:flex;flex-direction:column;gap:.375rem;font-size:.9375rem}
.notes p{margin:0}
.act{min-height:2.875rem;border:1.5px solid var(--line);background:var(--card);border-radius:.875rem;padding:.5rem .75rem;display:flex;align-items:center;gap:.5rem;font-weight:700;font-size:.9375rem;text-align:left;width:100%}
.act[aria-pressed="true"]{background:var(--soft)}
.act.primary{background:var(--sun);border-color:var(--sun);color:var(--sun-ink);justify-content:center}
.said{margin:0;font-size:.875rem;font-weight:700;color:#14532a;min-height:1.2em}
.copybox{width:100%;min-height:7rem;border:1.5px solid var(--line);border-radius:.75rem;background:var(--paper);color:var(--ink);font:400 .875rem var(--body);padding:.5rem}
.more{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:.5rem}
.fine{margin:0;font-size:.8125rem;color:var(--sub)}

/* cards for setup, hold, no match */
.cardbox{background:var(--card);border-radius:1.125rem;padding:1rem;display:flex;flex-direction:column;gap:.875rem}
.cardbox h1,.cardbox h2{margin:0;font:900 1.4375rem/1.1 var(--display);letter-spacing:-.025em;text-wrap:balance}
.cardbox p{margin:0}
.grp{border:0;margin:0;padding:0;min-width:0}
.grp legend,.flab{padding:0;margin:0 0 .375rem;font-size:.875rem;font-weight:700;color:var(--sub);display:block}
.pills{display:flex;flex-wrap:wrap;gap:.375rem}
.pill{min-height:2.75rem;border:1.5px solid var(--line);background:var(--card);border-radius:1.375rem;padding:.375rem .875rem;font-weight:600;font-size:.9375rem}
.pill[aria-checked="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.txt{width:100%;min-height:2.875rem;border:1.5px solid var(--line);border-radius:.75rem;background:var(--paper);color:var(--ink);font:400 1rem var(--body);padding:.5rem .75rem}
.hint{font-size:.8125rem;color:var(--sub);margin:.25rem 0 0}

/* console */
.console{background:var(--panel);color:var(--ptext);border-radius:1.375rem;padding:.625rem .75rem .75rem;margin-top:.375rem}
.cin{max-width:30rem;margin:0 auto;display:flex;flex-direction:column;gap:.5rem}
.console[inert]{opacity:.45}
@media (min-height:36rem){
  :root:not(.flow) .console{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;border-radius:1.375rem 1.375rem 0 0;box-shadow:0 -10px 30px -12px rgba(10,14,40,.45);
    padding:.625rem max(16px,env(safe-area-inset-right,0px)) calc(.625rem + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  :root:not(.flow) .app{padding-bottom:calc(var(--ch) + .25rem)}
}
.dial{border-radius:1rem;overflow:hidden;background:var(--seg)}
.sky{position:relative;display:block;line-height:0}
.sky i{position:absolute;inset:0;opacity:0;transition:opacity .5s ease}
.sky i.breakfast{background:linear-gradient(180deg,#ff8f5e,#ffd7a1)}
.sky i.lunch{background:linear-gradient(180deg,#3d97f5,#bfe2ff)}
.sky i.snack{background:linear-gradient(180deg,#f0623f,#ffc46e)}
.sky i.dinner{background:radial-gradient(1.5px 1.5px at 18% 30%,#fff 50%,rgba(255,255,255,0) 51%),radial-gradient(1.5px 1.5px at 62% 18%,#fff 50%,rgba(255,255,255,0) 51%),radial-gradient(1px 1px at 82% 55%,#fff 50%,rgba(255,255,255,0) 51%),radial-gradient(1px 1px at 38% 62%,#fff 50%,rgba(255,255,255,0) 51%),linear-gradient(180deg,#161a48,#3b3f8c)}
.dial[data-meal="breakfast"] .sky i.breakfast,.dial[data-meal="lunch"] .sky i.lunch,.dial[data-meal="snack"] .sky i.snack,.dial[data-meal="dinner"] .sky i.dinner{opacity:1}
#arc{position:relative;display:block;width:100%;height:auto;touch-action:none;cursor:grab}
#arc .track{fill:none;stroke:rgba(255,255,255,.7);stroke-width:2.5;stroke-linecap:round}
#arc .ticks{fill:none;stroke:rgba(255,255,255,.55);stroke-width:7;stroke-dasharray:1.5 9.5}
#arc .stop{fill:#fff;stroke:rgba(21,26,48,.35);stroke-width:1}
#bead .sun{fill:var(--sun);stroke:#fff;stroke-width:2.5}
#bead .ray{stroke:var(--sun);stroke-width:2.6;stroke-linecap:round}
#bead .moon{fill:#f6f2dc;stroke:#fff;stroke-width:1.5}
#bead .bite{fill:#252a66}
#bead .night{opacity:0;transition:opacity .3s ease}#bead .day{transition:opacity .3s ease}
.dial[data-meal="dinner"] #bead .night{opacity:1}.dial[data-meal="dinner"] #bead .day{opacity:0}
.meals{display:grid;grid-template-columns:repeat(auto-fit,minmax(max(24%,min(47%,(4.5rem - 24%)*999)),1fr));gap:.25rem;padding:.25rem}
.meals button,.segs button{min-height:2.75rem;border:0;border-radius:.75rem;background:transparent;color:var(--psub);font-weight:700;font-size:.9375rem;line-height:1.12;padding:.25rem .125rem;transition:background-color .2s ease,color .2s ease}
.meals button[aria-checked="true"],.segs button[aria-checked="true"]{background:#fff;color:var(--ink)}
.meals button{position:relative}.meals .now{position:absolute;top:.25rem;left:50%;width:.4375rem;height:.4375rem;margin-left:-.21875rem;border-radius:50%;background:var(--sun)}
.today{display:grid;grid-template-columns:auto minmax(0,1fr);gap:.5rem;align-items:center}
.rlab{font-size:.8125rem;font-weight:700;color:var(--psub);line-height:1.15;max-width:3.25rem}
.segs{display:grid;grid-template-columns:repeat(auto-fit,minmax(max(24%,min(46%,(3.7rem - 24%)*999)),1fr));gap:.1875rem;background:var(--seg);border-radius:.875rem;padding:.1875rem}
.segs button{font-size:.875rem}
.keys{display:flex;flex-wrap:wrap;gap:.375rem}
.key{flex:1 1 6.2rem;min-height:3.125rem;border:1.5px solid var(--pline);background:transparent;border-radius:.875rem;padding:.3125rem .5rem;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:.0625rem;min-width:0;color:var(--ptext)}
#key-hunger{flex-basis:4.9rem}#key-low{flex-basis:6.9rem}
.key span{font-size:.8125rem;color:var(--psub);line-height:1.15}
.key b{font-size:.9375rem;line-height:1.15;display:flex;align-items:center;justify-content:space-between;gap:.25rem}
.key b::after{content:"";width:.4375rem;height:.4375rem;border-right:2px solid var(--psub);border-bottom:2px solid var(--psub);transform:rotate(-135deg);flex:none;margin-top:.2rem}
.tray{display:flex;flex-direction:column;gap:.5rem}
.thead{display:flex;align-items:center;justify-content:space-between;gap:.5rem;font-weight:700}
.thead button{min-height:2.75rem;border:1.5px solid var(--pline);background:transparent;color:var(--ptext);border-radius:1.375rem;padding:.25rem .875rem;font-weight:700;font-size:.875rem}
.topts{display:grid;grid-template-columns:repeat(auto-fit,minmax(max(31%,min(48%,(5.6rem - 31%)*999)),1fr));gap:.375rem}
.topts button{min-height:2.875rem;border:0;border-radius:.75rem;background:var(--seg);color:var(--ptext);font-weight:700;font-size:.9375rem;line-height:1.12;padding:.25rem}
.topts button[aria-checked="true"]{background:#fff;color:var(--ink)}

/* sheets */
dialog{border:0;padding:0;background:transparent;color:var(--ink);width:100%;max-width:30rem;margin:auto auto 0;max-height:92dvh}
dialog::backdrop{background:rgba(10,12,30,.6)}
.sheet{background:var(--card);border-radius:1.375rem 1.375rem 0 0;padding:1rem 1rem calc(1rem + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:.875rem;overflow-y:auto;max-height:92dvh}
.sheet h2{margin:0;font:900 1.4375rem/1.1 var(--display);letter-spacing:-.025em}
.sheet p,.sheet ul{margin:0}
.sheet ul{padding-left:1.125rem;display:flex;flex-direction:column;gap:.25rem}
.stamp{background:var(--note);color:var(--note-ink);border-radius:.75rem;padding:.5rem .75rem;font-weight:700;font-size:.9375rem}
@media (min-width:40rem){dialog{margin:auto}.sheet{border-radius:1.375rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

  for(var i=0;i<8;i++){var a=i*Math.PI/4;rays.appendChild(svg("line",{x1:(15.5*Math.cos(a)).toFixed(1),y1:(15.5*Math.sin(a)).toFixed(1),x2:(18.5*Math.cos(a)).toFixed(1),y2:(18.5*Math.sin(a)).toFixed(1),"class":"ray"}));}
  day.appendChild(rays);day.appendChild(svg("circle",{r:11.5,"class":"sun"}));

function placeBead(){bead.setAttribute("transform","translate("+beadX.toFixed(1)+" "+arcY(beadX).toFixed(1)+")");rays.setAttribute("transform","rotate("+(beadX*1.1).toFixed(1)+")");}
function glide(){
  cancelAnimationFrame(raf);
  if(reduced){beadX=target;placeBead();return;}
  (function step(){var d=target-beadX;if(Math.abs(d)<.4){beadX=target;placeBead();return;}beadX+=d*.24;placeBead();raf=requestAnimationFrame(step);})();
}
function nearest(x){var best=S.meal,bd=1e9;ORDER.forEach(function(m){var d=Math.abs(x-STOP[m]);if(d<bd){bd=d;best=m;}});return best;}

  function up(){arc.removeEventListener("pointermove",move);arc.removeEventListener("pointerup",up);arc.removeEventListener("pointercancel",up);target=STOP[S.meal];glide();}
  arc.addEventListener("pointermove",move);arc.addEventListener("pointerup",up);arc.addEventListener("pointercancel",up);
  move(e);
});
