<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F2ECE1"><meta name="color-scheme" content="only light"><style>body{margin:0}[hidden]{display:none!important}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style></head><body><title>Next Plate</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400..700&family=EB+Garamond:ital,wght@0,400..800;1,400..600&family=Caveat:wght@500..700&display=swap">
<style>
/* Layout: five live instruments. On a phone they are tabs (Today, Lab, Rescue, Rhythm, Ask). On a wide screen they sit together as a studio: plate engine and plate lab on the first row, rescue, day rhythm and ask on the second. */
:root{
  --bg:#ECEFEA; --surface:#FFFFFF; --surface2:#F4F6F2; --ink:#13201E; --ink2:#50605B; --ink3:#78867F; --line:#DCE3DC;
  --brand:#0D5C59; --brand-ink:#FFFFFF; --brand-soft:#DDEDE9; --brand-text:#0B5552;
  --hero1:#0F6460; --hero2:#0A3A3A; --hero-ink:#F1F7F4; --hero-ink2:rgba(241,247,244,.74); --hero-line:rgba(241,247,244,.16); --hero-chip:rgba(241,247,244,.13);
  --haldi:#F2B43C; --veg:#5DB27B; --pro:#E59B3A; --grain:#EED39C; --side:#A7CBC5; --track:#E4EAE4; --track-dark:rgba(241,247,244,.14);
  --chilli:#B4432D; --ok:#23804F; --warn-bg:#FFF2D2; --warn-ink:#5B410E; --toast:#13201E; --toast-ink:#F1F7F4;
  --shadow:0 1px 2px rgba(16,40,36,.06),0 10px 28px -8px rgba(16,40,36,.14);
  --display:"Bricolage Grotesque","Figtree",ui-sans-serif,"Segoe UI",Roboto,sans-serif;
  --text:"Figtree",ui-sans-serif,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r-card:22px; --r-ctl:14px; --settle:cubic-bezier(.2,.8,.2,1);
}



*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/22px var(--text);-webkit-font-smoothing:antialiased;display:flex;justify-content:center}
button,a,input{font:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
button{border:0;background:none;padding:0;margin:0;cursor:pointer;text-align:left}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.cap{font-size:11px;line-height:14px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;color:var(--ink3);margin:0}
.num{font-variant-numeric:tabular-nums}

/* app frame */
.app{position:relative;width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;background:var(--bg);overflow:hidden}
@media (min-width:520px){body{align-items:center;padding-block:20px}.app{max-width:400px;height:min(860px,100%);border-radius:32px;box-shadow:0 30px 80px -24px rgba(10,40,36,.4),0 0 0 1px var(--line)}}
.top{flex:none;height:56px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;font:700 17px/20px var(--display);letter-spacing:-.01em;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:9px;background:linear-gradient(150deg,var(--hero1),var(--hero2));display:grid;place-items:center}
.mark svg{width:20px;height:20px}
.myfood{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:13px;font-weight:600;color:var(--ink2);min-width:0}
.myfood span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.myfood svg.i{width:16px;height:16px}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-top:2px;padding-bottom:28px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.view{display:flex;flex-direction:column;gap:14px}
.view.enter{animation:rise 260ms var(--settle)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* bottom tabs */
.tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 10px 8px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;min-height:50px;justify-content:center;border-radius:14px;color:var(--ink3);font-size:12px;font-weight:600;position:relative}
.tab[aria-current="page"]{color:var(--brand-text)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:2px;width:44px;height:30px;border-radius:15px;background:var(--brand-soft);z-index:0}
.tab svg,.tab span{position:relative;z-index:1}
.tab svg.i{width:22px;height:22px}

/* context */
.when{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px;line-height:18px;color:var(--ink2);font-weight:600}
.when>span:first-child{display:flex;align-items:center;gap:6px}
.when svg.i{width:16px;height:16px;color:var(--pro)}
.daychip{font-size:12px;font-weight:700;color:var(--brand-text);background:var(--brand-soft);padding:3px 10px;border-radius:999px;white-space:nowrap}
.goal{display:flex;align-items:center;gap:12px;background:var(--surface);border-radius:18px;padding:8px 8px 8px 10px;box-shadow:0 0 0 1px var(--line)}
.goal-ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand-text);flex:none}
.goal-t{flex:1;min-width:0}
.goal-t b{display:block;font:700 16px/20px var(--display);letter-spacing:-.01em}
.goal-btn{min-height:40px;padding:0 14px;border-radius:12px;background:var(--surface2);font-size:13px;font-weight:700;color:var(--brand-text);box-shadow:0 0 0 1px var(--line)}
.choice-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.choice{min-height:46px;border-radius:var(--r-ctl);background:var(--surface);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 8px;text-align:center;font-size:13px;line-height:16px;font-weight:600;color:var(--ink2)}
.choice[aria-pressed="true"],.choice[aria-checked="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:none}
.choice svg.i{width:18px;height:18px}

.meals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface);border-radius:18px;padding:4px;box-shadow:0 0 0 1px var(--line)}
.meal{min-height:52px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;line-height:14px;font-weight:700;color:var(--ink3);position:relative;transition:background-color 200ms var(--settle),color 200ms var(--settle)}
.meal svg.i{width:20px;height:20px}
.meal[aria-checked="true"]{background:var(--brand);color:var(--brand-ink)}
.meal .now{position:absolute;top:6px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--haldi)}
.sits{display:flex;gap:8px;overflow-x:auto;margin-left:-16px;margin-right:-16px;padding:2px 16px 4px;scrollbar-width:none}
.sits::-webkit-scrollbar{display:none}
.sit{flex:none;min-height:42px;display:flex;align-items:center;gap:7px;padding:0 14px 0 11px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:14px;font-weight:600;color:var(--ink2);white-space:nowrap}
.sit svg.i{width:18px;height:18px}
.sit[aria-checked="true"]{background:var(--ink);color:var(--surface);box-shadow:none}

/* plate card */
.plate{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden}
.plate.fresh .hero,.plate.fresh .serve{animation:rise 300ms var(--settle)}
.hero{background:linear-gradient(155deg,var(--hero1) 0%,var(--hero2) 78%);color:var(--hero-ink);padding:14px 16px 0;position:relative}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(242,180,60,.16),rgba(242,180,60,0) 70%);pointer-events:none}
.hero-top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative;z-index:1}
.hchip{display:inline-flex;align-items:center;gap:5px;min-height:26px;padding:0 10px;border-radius:999px;background:var(--hero-chip);font-size:12px;font-weight:700;line-height:14px;white-space:nowrap}
.hchip svg.i{width:14px;height:14px}
.hchip.fit svg.i{color:var(--haldi)}
.hchip.time{margin-left:auto}
.hero-main{display:grid;grid-template-columns:104px minmax(0,1fr);gap:14px;align-items:center;padding:14px 0 14px;position:relative;z-index:1}
.ring{display:block;width:104px;height:104px}
.ring .seg{transition:stroke-dasharray 450ms var(--settle),stroke-dashoffset 450ms var(--settle)}
.ring-c1{font:800 22px/1 var(--display);fill:currentColor}
.ring-c2{font:700 9.5px/1 var(--text);letter-spacing:.08em;text-transform:uppercase;fill:currentColor;opacity:.75}
.hero h2{margin:0;font:700 23px/27px var(--display);letter-spacing:-.015em;text-wrap:balance}
.hero .sub{margin:6px 0 0;font-size:13px;line-height:18px;color:var(--hero-ink2)}
.bal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--hero-line);position:relative;z-index:1}
.bal>div{padding:10px 8px 12px 0;min-width:0}
.bal>div+div{padding-left:10px;border-left:1px solid var(--hero-line)}
.bal .cap{color:var(--hero-ink2);display:flex;align-items:center;gap:5px}
.bal .cap i{width:8px;height:8px;border-radius:2px;display:inline-block}
.bal b{display:block;margin-top:3px;font-size:13px;line-height:17px;font-weight:700;overflow-wrap:anywhere}

.serve{padding:12px 16px 4px}
.serve-h{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:32px}
.linkbtn{min-height:36px;display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;color:var(--brand-text);padding:0 2px}
.linkbtn svg.i{width:16px;height:16px}
.measures{list-style:none;margin:4px 0 0;padding:0}
.measures li{display:grid;grid-template-columns:50px minmax(0,1fr);gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.measures li:last-child{border-bottom:0}
.qty{font:700 25px/26px var(--display);text-align:center;letter-spacing:-.02em;font-variant-numeric:tabular-nums;border-radius:12px;padding:6px 0 5px;background:var(--surface2);position:relative}
.qty::after{content:"";position:absolute;left:8px;right:8px;bottom:3px;height:3px;border-radius:2px;background:var(--dot,transparent);opacity:.9}
.qty.chg{color:var(--brand-text)}
.food{font-size:15px;line-height:20px;min-width:0}
.food b{font-weight:700}
.tag{display:inline-block;margin-left:6px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--brand-text);background:var(--brand-soft);padding:1px 7px;border-radius:999px;vertical-align:1px}

.drawer{margin:4px 0 6px;padding:12px;border-radius:16px;background:var(--surface2);display:flex;flex-direction:column;gap:12px}
.drawer .cap{margin-bottom:6px}
.lows{display:flex;flex-wrap:wrap;gap:6px}
.lows .choice{min-height:38px;padding:0 12px;border-radius:999px;font-size:13px}
.swaprow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:6px 12px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:14px;line-height:19px}
.switch{flex:none;width:44px;height:26px;border-radius:13px;background:var(--line);position:relative;transition:background-color 200ms var(--settle)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform 200ms var(--settle)}
.swaprow[aria-pressed="true"] .switch{background:var(--brand)}
.swaprow[aria-pressed="true"] .switch::after{transform:translateX(18px)}

.acts{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px;padding:10px 16px 0}
.btn{min-height:48px;border-radius:var(--r-ctl);display:flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:700;background:var(--surface2);box-shadow:0 0 0 1px var(--line);color:var(--ink);text-align:center;text-decoration:none;padding:0 10px}
.btn svg.i{width:18px;height:18px}
.btn.primary{background:var(--brand);color:var(--brand-ink);box-shadow:none}
.btn.done{background:var(--brand-soft);color:var(--brand-text);box-shadow:none}
.btn:active,.choice:active,.sit:active,.meal:active,.goal-btn:active{transform:scale(.97)}
.share{display:flex;align-items:center;gap:8px;padding:10px 16px 14px}
.share .cap{flex:1}
.mini{min-height:40px;padding:0 12px;border-radius:12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;background:var(--surface);box-shadow:0 0 0 1px var(--line);color:var(--ink);text-decoration:none}
.mini svg.i{width:17px;height:17px}
.mini.wa svg.i{color:#1FA855}

.card{background:var(--surface);border-radius:var(--r-card);box-shadow:0 0 0 1px var(--line);padding:14px 16px}
.why{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px}
.why-ic{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--brand);color:var(--brand-ink)}
.why h3{margin:0;font-size:12px;line-height:16px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--brand-text)}
.why p{margin:4px 0 0;font-size:14px;line-height:20px;color:var(--ink2)}
.why p.lead{color:var(--ink);font-weight:600}
.note{border-radius:16px;background:var(--warn-bg);color:var(--warn-ink);padding:12px 14px;font-size:14px;line-height:20px;display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.note p{margin:0}.note p+p{margin-top:6px}
.note svg.i{width:20px;height:20px;margin-top:1px}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sec-h h3{margin:0;font:700 17px/22px var(--display);letter-spacing:-.01em}
.alts{display:flex;flex-direction:column;gap:8px}
.alt{display:grid;grid-template-columns:48px minmax(0,1fr) 20px;gap:12px;align-items:center;background:var(--surface);border-radius:18px;padding:10px 12px;box-shadow:0 0 0 1px var(--line);width:100%;min-height:68px}
.alt b{display:block;font:700 15px/19px var(--display);letter-spacing:-.005em}
.alt small{display:block;margin-top:2px;font-size:12px;line-height:16px;color:var(--ink3)}
.alt svg.i{color:var(--ink3)}
.alt .ring{width:48px;height:48px}

.day{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.dslot{border-radius:14px;padding:9px 8px;background:var(--surface);box-shadow:0 0 0 1px var(--line);min-height:76px;display:flex;flex-direction:column;gap:4px;min-width:0}
.dslot svg.i{width:16px;height:16px;color:var(--ink3)}
.dslot b{font-size:11px;line-height:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3)}
.dslot span{font-size:12px;line-height:15px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.dslot.got{background:var(--brand-soft);box-shadow:none}
.dslot.got svg.i{color:var(--brand-text)}
.dslot.now{box-shadow:0 0 0 2px var(--brand)}
.dslot .empty{color:var(--ink3);font-weight:500}
.fine{margin:2px 2px 0;font-size:12px;line-height:17px;color:var(--ink3)}
.morebtn{align-self:center;min-height:44px}

.empty-card{background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:22px 18px;display:flex;flex-direction:column;gap:10px}
.empty-card h2{margin:0;font:700 21px/26px var(--display);letter-spacing:-.01em;text-wrap:balance}
.empty-card p{margin:0;color:var(--ink2)}
.safe-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--warn-bg);color:var(--warn-ink)}

/* setup */
.setup-hero{background:linear-gradient(155deg,var(--hero1),var(--hero2));color:var(--hero-ink);border-radius:var(--r-card);padding:20px 18px 18px;position:relative;overflow:hidden}
.setup-hero h1{margin:8px 0 0;font:800 27px/31px var(--display);letter-spacing:-.02em;text-wrap:balance}
.setup-hero p{margin:8px 0 0;color:var(--hero-ink2);font-size:14px;line-height:20px}
.steps{display:flex;gap:6px;position:relative;z-index:1}
.steps i{height:4px;flex:1;border-radius:2px;background:var(--hero-chip)}
.steps i.on{background:var(--haldi)}
.qs h2{margin:4px 0 10px;font:700 19px/24px var(--display);letter-spacing:-.01em}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.tile{min-height:56px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1px var(--line);display:flex;align-items:center;gap:10px;padding:8px 12px;font-size:15px;font-weight:700;line-height:19px;text-align:left}
.tile i{width:10px;height:10px;border-radius:50%;flex:none;background:var(--dot,var(--line))}
.tile[aria-checked="true"]{background:var(--brand);color:var(--brand-ink);box-shadow:none}
.tile small{display:block;font-weight:500;font-size:12px;line-height:15px;opacity:.8}

/* sheet */
.sheet{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;background:rgba(8,20,18,.42);animation:fade 180ms ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet-card{background:var(--bg);border-radius:26px 26px 0 0;max-height:88%;overflow-y:auto;padding:10px 16px 18px;display:flex;flex-direction:column;gap:14px;animation:up 260ms var(--settle)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center}
.sheet-h{display:flex;align-items:center;justify-content:space-between}
.sheet-h h2{margin:0;font:700 20px/24px var(--display)}

/* ask */
.ask-head{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:center}
.ask-ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--haldi)}
.ask-head b{display:block;font:700 17px/21px var(--display)}
.ask-head small{display:block;font-size:12px;line-height:16px;color:var(--ink3);margin-top:2px}
.prompts{display:flex;flex-direction:column;gap:8px}
.prompt{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:48px;padding:10px 14px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:14px;line-height:19px;font-weight:600;width:100%}
.prompt svg.i{width:16px;height:16px;color:var(--brand-text)}
.thread{display:flex;flex-direction:column;gap:12px}
.bub{align-self:flex-end;max-width:86%;background:var(--ink);color:var(--surface);padding:10px 14px;border-radius:18px 18px 6px 18px;font-size:14px;line-height:20px}
.ans{align-self:stretch;background:var(--surface);border-radius:20px 20px 20px 6px;box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:12px}
.ans-h{display:flex;align-items:center;gap:8px;font-size:12px;line-height:16px;color:var(--ink3);font-weight:600}
.ans-h b{color:var(--ink);font-weight:800}
.ans-h .dot{width:22px;height:22px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(150deg,var(--hero1),var(--hero2));color:var(--haldi)}
.ans-h .dot svg.i{width:13px;height:13px}
.ans-read{margin:0;font:600 16px/22px var(--display);letter-spacing:-.005em;color:var(--ink)}
.ans-read.wait{color:var(--ink3)}
.ans-read.wait::after{content:"";display:inline-block;width:1.2em;animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.pick{border-radius:16px;background:var(--surface2);padding:12px;display:flex;flex-direction:column;gap:6px}
.pick-h{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.pick-h .ring{width:44px;height:44px}
.pick-h b{display:block;font:700 16px/20px var(--display);letter-spacing:-.01em}
.pick-h small{display:block;font-size:12px;line-height:15px;color:var(--ink3);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.pick .measures li{grid-template-columns:42px minmax(0,1fr);padding:6px 0}
.pick .qty{font-size:19px;line-height:20px;padding:5px 0 4px;background:var(--surface)}

.pick-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.others{display:flex;flex-direction:column;gap:6px}
.other{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:8px 12px;border-radius:14px;box-shadow:0 0 0 1px var(--line);font-size:14px;font-weight:700;width:100%}
.swaps{display:flex;flex-direction:column;gap:6px}
.swap{border-radius:14px;box-shadow:0 0 0 1px var(--line);padding:9px 12px;display:flex;flex-direction:column;gap:3px;font-size:14px;line-height:19px}

.ans small.meta{font-size:12px;line-height:16px;color:var(--ink3)}
.composer{flex:none;padding-top:8px;padding-bottom:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.send.cam{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.composer form{display:flex;gap:8px;align-items:center}
.composer input{flex:1;min-width:0;height:50px;border-radius:16px;border:0;box-shadow:0 0 0 1px var(--line);background:var(--surface);padding:0 14px;font-size:16px;color:var(--ink)}
.composer input::placeholder{color:var(--ink3)}
.send{width:50px;height:50px;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex:none}
.privacy{margin:0;font-size:11px;line-height:15px;color:var(--ink3);text-align:center}

/* check */
.presets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;background:var(--surface);border-radius:18px;padding:4px;box-shadow:0 0 0 1px var(--line)}
.preset{min-height:44px;border-radius:14px;font-size:13px;line-height:16px;font-weight:700;color:var(--ink3);text-align:center;padding:4px}
.preset[aria-checked="true"]{background:var(--brand);color:var(--brand-ink)}
.bigplate{display:grid;grid-template-columns:150px minmax(0,1fr);gap:14px;align-items:center}
.bigplate .ring{width:150px;height:150px}
.legend{display:flex;flex-direction:column;gap:8px}
.legend div{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:8px;align-items:center;font-size:13px;line-height:17px;font-weight:600}
.legend i{width:10px;height:10px;border-radius:3px}
.legend em{font-style:normal;color:var(--ink3);font-weight:700;font-variant-numeric:tabular-nums}
.steppers{display:flex;flex-direction:column}
.stp{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.stp:last-child{border-bottom:0}
.stp i{width:10px;height:28px;border-radius:5px}
.stp b{display:block;font-size:15px;line-height:19px}
.stp small{display:block;font-size:12px;line-height:15px;color:var(--ink3)}
.ctr{display:flex;align-items:center;gap:6px}
.ctr button{width:40px;height:40px;border-radius:12px;background:var(--surface2);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center}

.ctr output{min-width:52px;text-align:center;font:700 17px/20px var(--display);font-variant-numeric:tabular-nums}

.checks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.checks li{display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;font-size:14px;line-height:20px}
.checks li i{width:26px;height:26px;border-radius:9px;display:grid;place-items:center}
.checks li.ok i{background:var(--brand-soft);color:var(--ok)}
.checks li.no i{background:var(--warn-bg);color:var(--warn-ink)}
.checks li svg.i{width:16px;height:16px;stroke-width:2.4}
.checks b{font-weight:700}

.toast{position:absolute;left:50%;top:62px;transform:translateX(-50%);z-index:30;max-width:calc(100% - 32px);background:var(--toast);color:var(--toast-ink);border-radius:16px;padding:10px 14px;font-size:14px;line-height:19px;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 10px 30px -8px rgba(0,0,0,.35);animation:drop 240ms var(--settle)}
.toast svg.i{width:18px;height:18px;color:var(--haldi)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.said{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v4: instruments, studio ===== */
:root{--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--ink-panel:#0C2B2C;--panel2:#081D1F;--glow:#58E0B4;--amber:#F2B43C;--p-ink:#EAF4F0;--p-ink2:rgba(234,244,240,.68);--p-line:rgba(234,244,240,.13);--band-g:#7BE3B5;--band-m:#F6C665;--band-s:#FF9B7D;--panelbg:#F4F6F2}


.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.eyebrow{margin:0;font:700 10.5px/14px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-text)}
.panel-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.panel-h h2{margin:2px 0 0;font:700 21px/25px var(--display);letter-spacing:-.015em}
.live{display:inline-flex;align-items:center;gap:7px;font:700 10px/14px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3);white-space:nowrap}
.live i{width:7px;height:7px;border-radius:50%;background:var(--ok);animation:pulse 2.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,224,180,.5)}70%{box-shadow:0 0 0 7px rgba(88,224,180,0)}100%{box-shadow:0 0 0 0 rgba(88,224,180,0)}}
.card-t{margin:0 0 10px;font:700 17px/22px var(--display);letter-spacing:-.01em}
.tsub{margin:0;font-size:12px;line-height:16px;color:var(--ink3)}
.tabs{grid-template-columns:repeat(5,1fr)}
.tab{font-size:11.5px}
.lswitch{display:none;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:0 0 0 1px var(--line)}
.lswitch button{min-height:34px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink3)}
.lswitch button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}

.ctx{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.tiles,.rail{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:2px 16px 4px;scrollbar-width:none}
.tiles::-webkit-scrollbar,.rail::-webkit-scrollbar{display:none}
.tile2{flex:none;min-width:158px;background:var(--surface);border-radius:18px;box-shadow:0 0 0 1px var(--line);padding:10px 12px 11px;display:flex;flex-direction:column;gap:6px}
.tile2 .v{font:700 19px/22px var(--mono);letter-spacing:-.03em;white-space:nowrap}
.tile2 .v small{font:600 12px/16px var(--text);letter-spacing:0;color:var(--ink3)}
.bar{height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--brand);transition:width 500ms var(--settle)}
.mdots{display:flex;gap:5px}.mdots i{flex:1;height:6px;border-radius:3px;background:var(--track)}.mdots i.on{background:var(--brand)}
.wbtns{display:flex;gap:6px}
.wbtn{width:40px;height:30px;border-radius:10px;background:var(--surface2);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center}
.wbtn svg.i{width:15px;height:15px}
.pillsel{flex:none;min-height:42px;display:flex;align-items:center;gap:7px;padding:0 10px 0 12px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:13.5px;font-weight:600;color:var(--ink3);white-space:nowrap}
.pillsel b{color:var(--ink);font-weight:700}
.pillsel svg.i{width:17px;height:17px}.pillsel svg.i:last-child{width:14px;height:14px;opacity:.6}
.pillsel[aria-expanded="true"]{background:var(--ink);color:var(--surface);box-shadow:none}.pillsel[aria-expanded="true"] b{color:var(--surface)}
.tile svg.i{width:20px;height:20px}
.slide{background:var(--surface);border-radius:18px;box-shadow:0 0 0 1px var(--line);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.slide-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--ink3);font-weight:600}
.slide-v{font-size:14px;color:var(--ink);font-weight:700}.slide-v b{font-size:18px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:30px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--brand) var(--fill,50%),var(--track) var(--fill,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 2px var(--brand),0 3px 8px rgba(0,0,0,.22);margin-top:-10px}
input[type=range]::-moz-range-track{height:8px;border-radius:4px;background:var(--track)}
input[type=range]::-moz-range-progress{height:8px;border-radius:4px;background:var(--brand)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--brand)}
.kg{display:flex;gap:12px;align-items:center}
.kg input{width:96px;height:48px;border-radius:14px;border:0;box-shadow:0 0 0 1px var(--line);background:var(--surface);padding:0 12px;font:700 17px var(--mono);color:var(--ink)}
.kg span{font-size:12.5px;line-height:17px;color:var(--ink3)}

.read4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--hero-line);position:relative;z-index:1}
.read4>div{padding:10px 4px 11px 0;min-width:0}.read4>div+div{padding-left:10px;border-left:1px solid var(--hero-line)}
.read4 .cap{color:var(--hero-ink2)}
.read4 .v{display:block;margin-top:3px;font:700 17px/20px var(--mono);letter-spacing:-.03em;white-space:nowrap}
.read4 .v small{font:600 10.5px/14px var(--text);letter-spacing:0;opacity:.72;margin-left:2px}
.read4 .v .mono{font-size:inherit}
.band-g{color:var(--band-g)}.band-m{color:var(--band-m)}.band-s{color:var(--band-s)}
.read4 .v.band-g,.read4 .v.band-m,.read4 .v.band-s{font-size:14px}
.tune{display:flex;gap:6px;flex-wrap:wrap;padding:10px 0 14px;border-top:1px solid var(--hero-line);position:relative;z-index:1}
.tune .cap{width:100%;color:var(--hero-ink2);margin-bottom:2px}
.tbtn{min-height:40px;padding:0 12px;border-radius:13px;background:var(--hero-chip);color:var(--hero-ink);font-size:13px;font-weight:700;display:inline-flex;align-items:center;gap:6px;box-shadow:inset 0 0 0 1px var(--hero-line);transition:background-color 180ms var(--settle),color 180ms var(--settle)}
.tbtn svg.i{width:16px;height:16px}
.tbtn[aria-pressed="true"]{background:var(--haldi);color:#1D1503;box-shadow:none}
.tbtn:active,.hab:active,.move:active,.pillsel:active,.preset:active{transform:scale(.97)}
.modlog{margin:0;padding:0 0 13px;list-style:none;font-size:12.5px;line-height:18px;color:var(--hero-ink2);position:relative;z-index:1}
.modlog li{padding-left:16px;position:relative}.modlog li::before{content:"";position:absolute;left:2px;top:7px;width:7px;height:2px;border-radius:1px;background:var(--haldi)}

.labgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.labcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.inst{background:linear-gradient(160deg,var(--ink-panel),var(--panel2));color:var(--p-ink);border-radius:22px;padding:14px 14px 13px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.inst-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.inst .live{color:var(--p-ink2)}.inst .live i{background:var(--glow)}
.risev{font:700 13px/18px var(--mono);letter-spacing:-.02em;white-space:nowrap}
.curve{display:block;width:100%;height:auto}
.cb-g{fill:var(--glow);opacity:.11}.cb-m{fill:var(--amber);opacity:.07}
.c-th{stroke:var(--amber);stroke-width:1;stroke-dasharray:4 4;opacity:.65}
.c-lab{font:700 6.5px var(--mono);letter-spacing:.14em;fill:var(--p-ink2)}
.c-ax{font:600 7.5px var(--mono);fill:var(--p-ink2)}
.c-base{stroke:var(--p-line);stroke-width:1}
.c-raw{fill:none;stroke:var(--amber);stroke-width:1.8;stroke-dasharray:4 4;opacity:.9}
.c-act{fill:none;stroke:var(--glow);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(88,224,180,.55))}
.c-dot{fill:var(--glow);stroke:var(--ink-panel);stroke-width:2}
.inst-lg{display:flex;flex-wrap:wrap;gap:6px 14px;font:600 11px/14px var(--text);color:var(--p-ink2)}
.inst-lg i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.l-act{background:var(--glow)}.l-raw{background:repeating-linear-gradient(90deg,var(--amber) 0 4px,transparent 4px 8px)}
.habits{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.hab{border-radius:13px;padding:9px 9px 8px;background:rgba(234,244,240,.06);box-shadow:inset 0 0 0 1px var(--p-line);color:var(--p-ink2);font-size:12px;line-height:15px;font-weight:700;min-height:62px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.hab small{font:700 9.5px/12px var(--mono);letter-spacing:.08em;text-transform:uppercase;opacity:.8}
.hab[aria-pressed="true"]{background:rgba(88,224,180,.17);box-shadow:inset 0 0 0 1.5px var(--glow);color:#D2F9EA}
.nums{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.nums .v{display:block;margin-top:2px;font:700 15px/18px var(--mono);letter-spacing:-.03em}.nums .v small{font:600 10.5px var(--text);letter-spacing:0;color:var(--ink3);margin-left:2px}

.dish{display:block;font:700 18px/22px var(--display);letter-spacing:-.01em}
.dish-s{display:block;font-size:12px;line-height:16px;color:var(--p-ink2);margin-top:2px}
.cmp{display:flex;flex-direction:column;gap:9px;padding:2px 0 4px}
.cmp-row{display:grid;grid-template-columns:58px minmax(0,1fr) 104px;gap:10px;align-items:center}
.cmp-row .lab{font:700 9.5px/13px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--p-ink2)}
.cmp-bars{display:flex;flex-direction:column;gap:4px}
.cmp-bars i{display:block;height:7px;border-radius:4px;transition:width 520ms var(--settle)}
.cmp-bars .b0{background:rgba(234,244,240,.24)}.cmp-bars .b1{background:var(--glow)}.cmp-bars .b1.warn{background:var(--band-s)}
.cmp-row .val{font:700 13px/16px var(--mono);letter-spacing:-.03em;text-align:right;white-space:nowrap}
.cmp-row .val s{opacity:.5;font-weight:500;margin-right:5px}.cmp-row .val small{font:600 10px var(--text);letter-spacing:0;opacity:.7}
.moves{display:flex;flex-direction:column;gap:8px}
.move{display:grid;grid-template-columns:28px minmax(0,1fr);gap:11px;align-items:center;min-height:58px;padding:10px 12px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1px var(--line);width:100%;font-size:14px;line-height:19px;font-weight:600}
.move i{width:28px;height:28px;border-radius:10px;display:grid;place-items:center;background:var(--surface2);box-shadow:inset 0 0 0 1px var(--line);color:transparent}
.move i svg.i{width:16px;height:16px;stroke-width:2.6}
.move small{display:block;margin-top:3px;font:600 11px/14px var(--mono);letter-spacing:-.02em;color:var(--brand-text)}
.move[aria-pressed="true"]{box-shadow:0 0 0 2px var(--brand)}
.move[aria-pressed="true"] i{background:var(--brand);color:var(--brand-ink);box-shadow:none}

.pbars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;height:132px}
.pbar{display:flex;flex-direction:column;gap:4px;text-align:center;min-width:0}
.pbar .col{position:relative;flex:1;border-radius:9px;background:var(--track);overflow:hidden}
.pbar .col i{position:absolute;left:0;right:0;bottom:0;background:var(--brand);border-radius:9px;transition:height 520ms var(--settle)}
.pbar .col i.full{background:var(--ok)}
.pbar small{font:700 9px/12px var(--mono);letter-spacing:.02em;text-transform:uppercase;color:var(--ink3)}
.pbar .want{text-transform:none;letter-spacing:0;font-weight:600;opacity:.85}
.pv{font-size:11.5px;font-weight:700}
.tl{position:relative;display:flex;flex-direction:column}
.tl::before{content:"";position:absolute;left:68px;top:16px;bottom:16px;width:2px;background:var(--line)}
.tl-row{display:grid;grid-template-columns:54px 14px minmax(0,1fr) auto;gap:8px;padding:9px 0;align-items:center;position:relative}
.tl-time{font:600 10.5px/14px var(--mono);letter-spacing:-.02em;color:var(--ink3);text-align:right}
.tl-dot{width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line);position:relative;z-index:1;justify-self:center}
.tl-row.done .tl-dot{background:var(--brand);box-shadow:none}
.tl-row.now .tl-dot{background:var(--haldi);box-shadow:0 0 0 4px rgba(242,180,60,.28)}
.tl-row b{display:block;font-size:14.5px;line-height:19px}
.tl-row .s{display:block;font-size:12.5px;line-height:17px;color:var(--ink2)}
.mini.on{background:var(--brand-soft);color:var(--brand-text);box-shadow:none}

.serve-tools{display:flex;gap:14px;align-items:center}
.send.cam[aria-pressed="true"]{background:var(--chilli);color:#fff;box-shadow:none}
.linkbtn[aria-pressed="true"]{color:var(--chilli)}
.app[data-layout="phone"] #v-plate>.panel-h{display:none}
.app[data-layout="phone"] .panel-h .live{display:none}
.app[data-layout="phone"] .tune{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.app[data-layout="phone"] .tune .cap{grid-column:1/-1}
.app[data-layout="phone"] .tbtn{padding:6px 8px;font-size:12.5px;line-height:15px;min-height:46px;justify-content:flex-start;text-align:left}
.app[data-layout="phone"] .tile2{padding:8px 12px 9px;gap:4px;min-width:150px}
.app[data-layout="phone"] .tile2 .v{font-size:17px;line-height:20px}
.app[data-layout="phone"] #v-ask{min-height:calc(100% + 28px);margin-bottom:-28px}

#ask-body{flex:1}

@media (min-width:1080px){
  .lswitch{display:flex}
  body[data-layout="studio"]{padding-block:0;align-items:stretch}

  .app[data-layout="studio"] .tabs,.app[data-layout="studio"] .only-phone{display:none}
  .app[data-layout="studio"] .scroll{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:18px;align-items:start;align-content:start;padding-top:4px;padding-bottom:44px;padding-left:max(28px,calc(50% - 680px),env(safe-area-inset-left,0px));padding-right:max(28px,calc(50% - 680px),env(safe-area-inset-right,0px))}
  .app[data-layout="studio"] .ctx{grid-column:1/-1;margin:0}
  .app[data-layout="studio"] .tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin:0;padding:0;overflow:visible;gap:12px}
  .app[data-layout="studio"] .rail{margin:0;padding:0;flex-wrap:wrap;overflow:visible}
  .app[data-layout="studio"] .panel{background:var(--panelbg);border:1px solid var(--line);border-radius:28px;padding:18px}

/* Owner-approved items from the Kinfolk Raw Linen review: 1 portion ring, 2 one colour per nutrient, 4 Pair it, 5 taste notes (3, the stoneware plate, is drawn in plate.js) */
:root{--pro:#B0613D;--veg:#6B7A3A;--grain:#B8862D;--side:#7A4958;--other:#CDB89A}
.n-pro{--nc:var(--pro)}.n-veg{--nc:var(--veg)}.n-grain{--nc:var(--grain)}.n-side{--nc:var(--side)}.n-ink{--nc:var(--ink3)}
.tcard[class*="n-"]::after{border-top:2px solid var(--nc);opacity:.85}
.tcard[class*="n-"] .cap{color:var(--nc)}
.tcard.n-ink .cap{color:var(--ink)}
.tile2[class*="n-"] .bar i{background:var(--nc)}
.tile2[class*="n-"] .cap{color:var(--nc)}
/* 1 portion ring: drawn inside the plate SVG (see look.js); its legend sits under the plate */
.pr-arc{fill:none;stroke-linecap:butt}
.plate.fresh .pr-arc{animation:prdraw 900ms var(--settle) backwards}
@keyframes prdraw{from{stroke-dasharray:0 999}}
@media (prefers-reduced-motion:reduce){.plate.fresh .pr-arc{animation:none}}
.prlegend{display:flex;flex-wrap:wrap;justify-content:center;gap:2px 14px;margin:2px 0 0;padding:0;list-style:none;font:500 15px/20px var(--text);color:var(--ink2)}
.prlegend li{display:flex;align-items:center;gap:6px;white-space:nowrap}
.prlegend i{width:14px;height:4px;border-radius:2px;background:var(--nc)}
.prlegend b{font-weight:600;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
/* 5 taste notes: two or three words above the dish name */
.taste{margin:6px 0 0;font:500 14px/18px var(--text);font-variant:small-caps;text-transform:lowercase;letter-spacing:.2em;color:var(--clay)}
.taste span+span::before{content:"·";margin:0 .55em;color:var(--ink3)}
/* 4 pairing tips for absorption: inside the plate card, under what to serve */
.pairs{margin:0 16px 12px;scroll-margin-top:12px;padding:12px 14px 10px;background:#FFFDF8;border-radius:3px;box-shadow:0 1px 0 rgba(60,44,28,.08),0 6px 14px -10px rgba(60,44,28,.4);transform:rotate(-.6deg)}
.pairs .ph{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 4px;border-bottom:1.5px dotted #C9BCA8;padding-bottom:4px}
.pairs .ph b{font:600 21px/24px var(--hand);color:var(--ink)}
.pairs .ph small{font:italic 400 14px/18px var(--text);color:var(--ink3)}
.pairs ul{list-style:none;margin:0;padding:0}
.pairs li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;padding:7px 0 6px;border-bottom:1px solid var(--line)}
.pairs li:last-child{border-bottom:0}
.pairs .plus{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:600 17px/1 var(--display);color:var(--surface);background:var(--olive);margin-top:1px}
.pairs .pf{font:italic 600 17px/22px var(--display);color:var(--ink)}
.pairs .pe{display:block;font:400 15.5px/21px var(--text);color:var(--ink2)}

/* ===== v6 legibility layer, loaded last (docs/ux/UX-CRITERIA.md). The Raw Linen look stays; what changes is what a 45+ reader on a
   320-412 px phone needs: one text face for everything functional (EB Garamond, figures included), the handwriting face only for the
   pencilled annotation on the plate, a 15 px floor for captions, darker inks that pass WCAG AA on every paper, and 44 px touch targets.
   Selectors start with #app so they win over the layers above; !important appears only where a layer above uses it. ===== */
:root{color-scheme:light only;
  --ink3:#6A5F51;            /* captions and hints: 5.3:1 on paper, 5.8:1 on surface (was #857967, 3.6:1) */
  --fine:#5E5446;            /* small print: 6.5:1 on paper */
  --pro-t:#9A4F2E;--veg-t:#5A6830;--grain-t:#8A6420;--side-t:#7A4958;   /* nutrient colours as text: each 4.5:1 or more on paper and cards */
  --band-g:#56652C;--band-m:#80561A;--band-s:#A0412A;                   /* Gentle / Moderate / Sharp as text */
  --clay-t:#9A4F2E;--olive-t:#56652C;
  --cap:600 15px/20px var(--text)}
#app{-webkit-text-size-adjust:100%;text-size-adjust:100%}

/* --- captions: upright, readable, no small caps at 12 px --- */
#app .cap,#app .eyebrow,#app .tsub.cap,#app .stp small,#app .cmp-row .lab{font:var(--cap);font-variant:normal;text-transform:none;letter-spacing:.01em;color:var(--ink2)}
#app .eyebrow{color:var(--clay-t)}
#app .fine,#app .privacy{font:italic 400 15px/22px var(--text);color:var(--fine)}
#app .tsub,#app .sub,#app .dish-s,#app .alt small,#app .move small,#app .tile2 .v small,#app .read4 .v small,#app .ringmid small,#app .hab small{font-size:15px;line-height:21px;color:var(--ink2)}
#app .hchip{font-size:15px;color:var(--ink2)}
#app .tag{font-size:14px}

/* --- masthead: fits 320 px, nothing under 14 px --- */
#app .brand{font-size:clamp(28px,9.2vw,38px);letter-spacing:clamp(.1em,1.6vw,.22em);max-width:100%;white-space:nowrap}
#app .mast{font-size:14px;line-height:20px;flex-wrap:wrap;row-gap:0}
#app .mast em{font-size:15px}
#app .myfood{min-height:44px;font-size:17px}

/* --- one text face for functional text: the handwriting face leaves labels, figures and status --- */
#app .tip,#app .tip b,#app .note,#app .tiles .tile2 .v,#app .read4 .v,#app .tcard .cap,#app .risev,#app .cmp-row .val,#app .pv,#app .hero .cuis,
#app .slide-v b,#app .readline .asked,#app .ringmid b,#app .ctr output,#app .hero .suffix,#app .hero .planned,#app .plate.wait .planned,
#app .order .planned,#app .order .oask,#app .pairs .ph b{font-family:var(--text)}
#app .tip.directive,#app .tip{font:400 17px/25px var(--text);color:var(--ink)}
#app .tip b{font-style:italic;font-weight:600}
#app .note p{font-size:16px;line-height:23px}
#app .hero .planned,#app .plate.wait .planned,#app .order .planned{font:italic 500 16.5px/23px var(--text);color:var(--olive-t)}
#app .hero .suffix{font:italic 500 17px/23px var(--text);color:var(--clay-t)}
#app .readline .asked{font:italic 500 19px/26px var(--text);color:var(--clay-t)}
#app .order .oask{font:italic 500 17px/24px var(--text);color:var(--clay-t)}
#app .pairs .ph b{font:italic 600 19px/24px var(--text)}
#app .pairs .ph small{font-size:15px;color:var(--ink2)}
#app .scribble{font-size:22px;line-height:24px}

/* --- figures: lining, in the text face, big enough to read at a glance --- */
#app .read4 .v{font:500 28px/30px var(--text);font-style:normal;font-variant-numeric:lining-nums tabular-nums}
#app .read4 .v small{font-size:16px}
#app .tcard .cap{font:600 15px/20px var(--text);color:var(--ink)}
#app .tcard.n-pro .cap{color:var(--pro-t)}#app .tcard.n-veg .cap{color:var(--veg-t)}#app .tcard.n-grain .cap{color:var(--grain-t)}#app .tcard.n-side .cap{color:var(--side-t)}
#app .tile2[class*="n-"] .cap{color:var(--ink2)}
#app .tiles .tile2 .v{font:600 21px/26px var(--text);font-variant-numeric:lining-nums tabular-nums}
#app .risev,#app .read4 .v.band-g,#app .read4 .v.band-m,#app .read4 .v.band-s{font:600 22px/26px var(--text)}

<script id="np-core">/* ===== Next Plate v5 core. Runs in the page and, unchanged, on the server (np-core).
   Spec: docs/SPEC-v5.md. Foundation: docs/foundation/ ([P] Pocket Dietitian, [S] Summit Edition). ===== */

/* ---------- option lists (validated on both sides) ---------- */
var OPT={
  diet:[["veg","Vegetarian"],["egg","Veg and egg"],["nonveg","Non-veg"],["jain","Jain"],["vegan","Vegan"]],
  health:[["none","Nothing to flag"],["diabetes","Diabetes"],["bp","High BP"],["kidney","Kidney condition"],["preg","Pregnant or nursing"]],
  region:[["n","North"],["s","South"],["w","West"],["e","East"]],
  leave:[["dairy","Dairy"],["nut","Nuts"],["wheat","Wheat"],["soya","Soya"]],
  sex:[["f","Female"],["m","Male"]],
  act:[["low","Mostly sitting"],["light","Light activity"],["mod","Exercise 3 to 5 days"],["high","Hard training most days"]],
  /* one-tap state, from [S] BIO_MODES; plain names, no invented biometrics */
  mode:[["strength","Strength day"],["trek","Trek day"],["focus","Desk day"],["rest","Wind-down"]],
  /* [P] MOOD_FILTERS */
  mood:[["best","Best fit"],["quick","Quick 15-min"],["protein","High protein"],["comfort","Comforting"],["light","Light"]],
  /* [P] CUISINES */
  cuisine:[["indian","Indian regional"],["med","Mediterranean"],["express","High-protein express"]],
  prep:[["home","Cooking at home"],["out","Ordering out"]],
  oil:[["min","Minimal oil"],["std","Standard oil"]],
  meal:[["breakfast","Breakfast"],["lunch","Lunch"],["snack","Snack"],["dinner","Dinner"]]
};

/* ---------- the after-meal curve: a model of direction, shown as a band, never a blood-sugar number ----------

   The size of each effect is illustrative; the direction follows published studies of meal order and light walking after meals. */
function riseOf(n,hab){

/* Validate one meal. Returns {meal} or {drop: reason}. */
function checkMeal(m,p){
